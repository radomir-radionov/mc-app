name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RESOURCES_GIT_URL: ${{ secrets.RESOURCES_GIT_URL }}
      RESOURCES_GIT_TOKEN: ${{ secrets.RESOURCES_GIT_TOKEN }}
      RESOURCES_GIT_REF: ${{ secrets.RESOURCES_GIT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Fetch study notes
        run: npm run ensure-resources
      - run: npm run lint
      - run: npm test
      - run: npm run check-order -- --strict
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RESOURCES_GIT_URL: ${{ secrets.RESOURCES_GIT_URL }}
      RESOURCES_GIT_TOKEN: ${{ secrets.RESOURCES_GIT_TOKEN }}
      RESOURCES_GIT_REF: ${{ secrets.RESOURCES_GIT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Fetch study notes
        run: npm run ensure-resources
      - uses: cypress-io/github-action@v7.4.6
        with:
          install: false
          browser: chrome
          build: npm run build
          start: npm run start:e2e
          wait-on: "http://127.0.0.1:3456"
          wait-on-timeout: 120
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
